<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار Subject & Verb - 50 سؤال</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;color:#172033;margin:0;padding:18px;line-height:1.6}
main{max-width:780px;margin:auto} h1{font-size:25px} .intro,.q,.result{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 9px #0001}
.tag{color:#2457a7;font-weight:bold} .option{display:block;text-align:right;background:#f6f8fc;border:1px solid #d8deea;border-radius:10px;padding:11px;margin:8px 0;cursor:pointer}
.option:has(input:checked){border-color:#2457a7;background:#eaf1ff} input{margin-left:8px;transform:scale(1.15)}
button{background:#2457a7;color:white;border:0;border-radius:10px;padding:13px 20px;font-size:17px;cursor:pointer;margin:8px 0}
.small{color:#586174;font-size:14px} .correct{color:#087b42} .wrong{color:#b42318}
</style></head><body><main>
<h1>اختبار Subject & Verb — 50 سؤال</h1>
<div class="intro">اختر إجابة واحدة لكل سؤال، ثم اضغط «صحّح الاختبار» لمعرفة درجتك وتصحيح أخطائك. الاختبار يعمل بالضغط على الإجابات.</div>
<form id="quiz"></form><button type="button" onclick="grade()">صحّح الاختبار</button> <button type="button" onclick="location.reload()">إعادة الاختبار</button>
<div id="result" class="result" hidden></div>
</main>
<script>
const qs=[["S + V", "Which sentence has one subject and one verb?", ["I play football.", "Ali and Sara play.", "I read and write."], 0, "I = subject; play = verb."], ["S + S + V", "Which sentence has two subjects and one verb?", ["Sara sleeps.", "Ali and Omar work.", "I cook and eat."], 1, "Ali and Omar = two subjects; work = one verb."], ["S + V + V", "Which sentence has one subject and two verbs?", ["My father works.", "Ali and I study.", "I read and write."], 2, "I = one subject; read and write = two verbs."], ["S + S + V + V", "Which sentence has two subjects and two verbs?", ["Ali and I sing and dance.", "Ali sings.", "I sing and dance."], 0, "Ali and I = two subjects; sing and dance = two verbs."], ["S + V", "Choose the correct sentence.", ["The baby cries.", "The baby and mother cry and laugh.", "The baby cries and sleeps."], 0, "The baby = one subject; cries = one verb."], ["S + S + V", "Choose the sentence with S + S + V.", ["My brother runs.", "My brother and sister study.", "My brother runs and jumps."], 1, "My brother and sister = two subjects; study = one verb."], ["S + V + V", "Choose the sentence with S + V + V.", ["We cook and clean.", "We and they cook.", "We cook."], 0, "We = one subject; cook and clean = two verbs."], ["S + S + V + V", "Choose the sentence with S + S + V + V.", ["The boys swim.", "The boys and girls sing and dance.", "The boys sing and dance."], 1, "The boys and girls = two subjects; sing and dance = two verbs."], ["S + V", "Find the sentence with one subject and one verb.", ["Birds fly.", "Birds and bees fly.", "Birds fly and sing."], 0, "Birds = one subject; fly = one verb."], ["S + S + V", "Find the sentence with two subjects and one verb.", ["Tom and Jack play.", "Tom plays.", "Tom and Jack play and run."], 0, "Tom and Jack = two subjects; play = one verb."], ["S + V + V", "Find the sentence with one subject and two verbs.", ["She dances.", "She dances and sings.", "She and I dance."], 1, "She = one subject; dances and sings = two verbs."], ["S + S + V + V", "Find the sentence with two subjects and two verbs.", ["You and I laugh and smile.", "You laugh.", "You and I laugh."], 0, "You and I = two subjects; laugh and smile = two verbs."], ["S + V", "Which part is the subject in 'My mother cooks'?", ["My mother", "cooks", "mother cooks"], 0, "The subject tells who does the action."], ["S + V", "Which part is the verb in 'The dog barks'?", ["The dog", "barks", "the"], 1, "Barks is the action verb."], ["S + S + V", "How many subjects are in 'Ali and Mona study'?", ["One", "Two", "Three"], 1, "Ali and Mona are two subjects."], ["S + V + V", "How many verbs are in 'I wash and dry the car'?", ["One", "Two", "Three"], 1, "Wash and dry are two verbs."], ["S + S + V + V", "Count the subjects in 'My father and mother cook and eat'.", ["One", "Two", "Four"], 1, "My father and mother are two subjects."], ["S + S + V + V", "Count the verbs in 'My father and mother cook and eat'.", ["One", "Two", "Four"], 1, "Cook and eat are two verbs."], ["S + V + V", "Choose the correct sentence.", ["He plays and watches TV.", "He play and watches TV.", "He and plays TV."], 0, "With he, use plays; the second verb watches also takes -s."], ["S + S + V", "Choose the correct sentence.", ["Ali and I goes home.", "Ali and I go home.", "Ali and I going home."], 1, "Two subjects joined by and take go."], ["S + V", "Choose the correct sentence.", ["She go to school.", "She goes to school.", "She going school."], 1, "She takes goes in the present simple."], ["S + V + V", "Choose the correct sentence.", ["I likes and enjoy music.", "I like and enjoy music.", "I liking and enjoy music."], 1, "With I, use the base verbs like and enjoy."], ["S + S + V + V", "Choose the correct sentence.", ["Ali and Sara reads and writes.", "Ali and Sara read and write.", "Ali and Sara reading and writing."], 1, "Two subjects joined by and take read and write."], ["S + S + V", "Complete: 'My father and my mother ____ at home.'", ["works", "work", "working"], 1, "The compound subject takes work."], ["S + V + V", "Complete: 'I ____ English and ____ Arabic.'", ["study / speak", "studies / speaks", "studying / speaking"], 0, "With I, use study and speak."], ["S + S + V + V", "Complete: 'Ali and I ____ and ____ together.'", ["studies / works", "study / work", "studying / working"], 1, "Ali and I take the base verbs study and work."], ["S + V", "Which word is the verb in 'The teacher explains'?", ["The teacher", "explains", "teacher"], 1, "Explains is the verb."], ["S + V", "Which word or phrase is the subject in 'The children laugh'?", ["The children", "laugh", "children laugh"], 0, "The children is the subject."], ["S + S + V", "Choose the sentence with two subjects.", ["The cat sleeps.", "The cat and dog sleep.", "The cat sleeps and eats."], 1, "The cat and dog are two subjects."], ["S + V + V", "Choose the sentence with two verbs.", ["The man walks.", "The man walks and talks.", "The man and woman walk."], 1, "Walks and talks are two verbs."], ["S + S + V + V", "Which pattern matches 'Mona and Huda read and write'?", ["S + V", "S + S + V", "S + S + V + V"], 2, "Two subjects and two verbs."], ["S + V", "Which pattern matches 'The sun shines'?", ["S + V", "S + S + V", "S + V + V"], 0, "One subject and one verb."], ["S + S + V", "Which pattern matches 'Ahmed and Khaled travel'?", ["S + V + V", "S + S + V", "S + S + V + V"], 1, "Two subjects and one verb."], ["S + V + V", "Which pattern matches 'We listen and learn'?", ["S + S + V", "S + V", "S + V + V"], 2, "One subject and two verbs."], ["S + S + V + V", "Which pattern matches 'My friends and I swim and run'?", ["S + S + V + V", "S + V + V", "S + S + V"], 0, "My friends and I = two subject groups; swim and run = two verbs."], ["S + V", "Complete: 'The baby ____.'", ["sleep", "sleeps", "sleeping"], 1, "The baby is singular: sleeps."], ["S + S + V", "Complete: 'Sara and Noor ____ English.'", ["studies", "study", "studying"], 1, "Two subjects: study."], ["S + V + V", "Complete: 'My brother ____ and ____ football.'", ["play / watch", "plays / watches", "playing / watching"], 1, "My brother is singular: plays and watches."], ["S + S + V + V", "Complete: 'The teacher and the student ____ and ____.'", ["talk / listen", "talks / listens", "talking / listening"], 0, "Compound subject: talk and listen."], ["S + V", "Which sentence is correct?", ["They works.", "They work.", "They working."], 1, "They takes work."], ["S + S + V", "Which sentence is correct?", ["My sister and brother is happy.", "My sister and brother are happy.", "My sister and brother am happy."], 1, "A compound subject takes are here."], ["S + V + V", "Which sentence is correct?", ["He wash and cleans the car.", "He washes and cleans the car.", "He washing and clean the car."], 1, "He takes -es on both present-simple verbs."], ["S + S + V + V", "Which sentence is correct?", ["My friends and I likes and play football.", "My friends and I like and play football.", "My friends and I liking and playing football."], 1, "Compound subject: like and play."], ["S + V", "In 'I need water', what is the subject?", ["I", "need", "water"], 0, "I is the subject."], ["S + V + V", "In 'I need and want help', what are the verbs?", ["I / help", "need / want", "want / help"], 1, "Need and want are the two verbs."], ["S + S + V", "In 'Ali and Omar need help', what is the verb?", ["Ali", "Omar", "need"], 2, "Need is the verb."], ["S + S + V + V", "In 'Ali and I read and discuss books', what are the subjects?", ["Ali and I", "read and discuss", "books"], 0, "Ali and I are the two subjects."], ["S + V", "Choose the best sentence using 'shoes'.", ["My shoes look nice.", "My shoes and look nice.", "My shoes looking nice."], 0, "My shoes is the subject; look is the verb."], ["S + V + V", "Choose the best sentence using 'weekends'.", ["I relax and read on weekends.", "I and relax weekends.", "I relaxing and read weekends."], 0, "I = subject; relax and read = verbs."], ["S + S + V + V", "Choose the best sentence using 'a party'.", ["Ali and Sara plan and enjoy a party.", "Ali plan and Sara enjoys a party.", "Ali and Sara planning a party."], 0, "Ali and Sara = two subjects; plan and enjoy = two verbs."]];
const form=document.getElementById('quiz');
qs.forEach((q,i)=>{
 const box=document.createElement('section');box.className='q';
 box.innerHTML=`<div class="tag">السؤال ${i+1} — النمط: ${q[0]}</div><div><b>${q[1]}</b></div>`+
 q[2].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${o}</label>`).join('')+
 `<div class="small" id="feedback${i}"></div>`;
 form.appendChild(box);
});
function grade(){
 let score=0, unanswered=0;
 qs.forEach((q,i)=>{
  const chosen=document.querySelector(`input[name="q${i}"]:checked`);
  const fb=document.getElementById(`feedback${i}`);
  if(!chosen){unanswered++;fb.textContent='لم تختر إجابة.';fb.className='small wrong';return;}
  if(Number(chosen.value)===q[3]){score++;fb.textContent='صحيح! '+q[4];fb.className='small correct';}
  else{fb.textContent='غير صحيح. الإجابة الصحيحة: '+String.fromCharCode(65+q[3])+'. '+q[2][q[3]]+' — '+q[4];fb.className='small wrong';}
 });
 const r=document.getElementById('result');r.hidden=false;
 r.innerHTML=`<h2>نتيجتك: ${score} من 50</h2><p>الإجابات غير المجابة: ${unanswered}</p><p>${score>=45?'ممتاز! أنت متمكن من الأنماط.':score>=35?'جيد جداً، راجع الأخطاء وحاول مرة أخرى.':score>=25?'بداية جيدة؛ ركّز على عدّ الفاعلين والأفعال.':'لا بأس، راجع الشرح ثم أعد المحاولة.'}</p>`;
 r.scrollIntoView({behavior:'smooth'});
}
</script></body></html>
